<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Ο Κόσμος του Άγγελου</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Manrope:wght@500;700;800&display=swap">
<style>
/* Layout: a sunny storybook sky. Home = shelves of soft rounded tiles grouped by theme; each game opens in one white card. Single bright theme by choice. */
:root{
  color-scheme: light;
  --sky:#7FCBFF;
  --sky2:#E3F5FF;
  --panel:#FFFFFF;
  --panel-hi:#EEF5FC;
  --ink:#1E2A4A;
  --soft:#4F5F86;
  --gold:#FFC83D;
  --leaf:#3DB867;
  --berry:#E8476B;
  --space:#1C2550;
  --display:"Comfortaa","Trebuchet MS",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  --lift: 0 6px 0 rgba(30,42,74,.12), 0 10px 24px rgba(30,42,74,.10);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--sky2);
  color:var(--ink);
  font-family:var(--body);
  font-size:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 40px;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  background-image:
    radial-gradient(ellipse 70px 26px at 8% 70px, #fff 98%, transparent),
    radial-gradient(circle 30px at calc(8% + 30px) 52px, #fff 98%, transparent),
    radial-gradient(ellipse 60px 22px at 90% 120px, #fff 98%, transparent),
    radial-gradient(circle 26px at calc(90% - 22px) 104px, #fff 98%, transparent),
    linear-gradient(var(--sky), var(--sky2) 65%);
  background-repeat:no-repeat;
  background-attachment:fixed;
}
img.px{display:block}
.wrap{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hello{display:flex;align-items:center;gap:12px}
.hello button{padding:0;flex:none}
.mascot{width:84px;height:84px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(30,42,74,.18))}
.mascot.hop{animation:hop .6s ease-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes hop{0%{transform:translateY(0) rotate(0)}40%{transform:translateY(-26px) rotate(-8deg)}70%{transform:translateY(0) rotate(4deg)}100%{transform:translateY(0)}}
.hi{display:flex;flex-direction:column;gap:6px;min-width:0}
.hi .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bubble{background:var(--panel);border-radius:14px;padding:6px 12px;font-size:15px;font-weight:700;color:var(--soft);box-shadow:0 2px 0 rgba(30,42,74,.1)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,6.4vw,40px);margin:0;text-wrap:balance}
.gems{background:var(--panel);box-shadow:var(--lift);border-radius:999px;padding:6px 16px 6px 8px;font-family:var(--display);font-weight:700;font-size:24px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.gems img{width:34px;height:34px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible{outline:4px solid var(--berry);outline-offset:3px}

/* Home */
.shelf{display:flex;flex-direction:column;gap:12px}
.shelf h2{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.tile{
  background:var(--c,var(--panel));border-radius:24px;padding:18px 10px 16px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  box-shadow:var(--lift);transition:transform .12s;
}
.tile:hover{transform:translateY(-3px)}
.tile:active{transform:translateY(3px)}
.tile .ic{width:68px;height:68px;display:grid;place-items:center}
.tile .ic img{width:68px;height:68px}
.tile .nm{font-family:var(--display);font-weight:700;font-size:20px;text-align:center}
.tile .hint{color:#3E4C70;font-size:14px;text-align:center}
.aa{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;color:#D23C5E}
.sw4{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:54px;height:54px}
.sw4 i{display:block;border-radius:50%}

/* Game card */
.card{background:var(--panel);border-radius:28px;padding:18px 16px 24px;display:flex;flex-direction:column;align-items:center;gap:18px;box-shadow:var(--lift)}
.bar{display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px}
.btn{background:var(--panel-hi);border-radius:999px;padding:10px 18px;font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 0 rgba(30,42,74,.12)}
.btn.say{background:var(--gold);color:#3A2A00}
.btn.go{background:var(--leaf);color:#fff;font-size:22px;padding:14px 28px}
.btn.mini{font-size:15px;padding:6px 12px;background:var(--panel)}
.q{font-family:var(--display);font-weight:700;font-size:clamp(22px,5.6vw,32px);text-align:center;margin:0;text-wrap:balance}
.stage{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;max-width:560px;min-height:80px}
.stage img{width:clamp(38px,10vw,54px);height:clamp(38px,10vw,54px)}
.stage .emo{font-size:clamp(96px,26vw,140px);line-height:1}
.plus{font-family:var(--display);font-weight:700;font-size:44px;color:var(--berry);padding:0 6px}
.group{display:flex;flex-wrap:wrap;gap:6px;max-width:200px;justify-content:center}
.qbox{width:clamp(38px,10vw,54px);height:clamp(38px,10vw,54px);border:4px dashed var(--berry);border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:28px;color:var(--berry)}
.word{font-family:var(--display);font-weight:700;font-size:clamp(34px,9vw,52px);letter-spacing:.05em}
.word .gap{display:inline-block;min-width:1em;border-bottom:5px dashed var(--berry);color:var(--berry);text-align:center}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;width:100%}
.ch{
  min-width:96px;min-height:96px;border-radius:24px;background:var(--panel-hi);
  font-family:var(--display);font-weight:700;font-size:46px;display:grid;place-items:center;padding:8px;
  box-shadow:0 6px 0 rgba(30,42,74,.14);transition:transform .1s;
}
.ch img{width:72px;height:72px}
.ch.planet{background:var(--space)}
.ch.planet img{width:100px;height:100px}
.ch:active{transform:translateY(4px)}
.ch.sw{background:var(--c);border-radius:50%;box-shadow:0 6px 0 rgba(30,42,74,.18), inset 0 0 0 3px rgba(30,42,74,.12)}
.ch.ok{outline:6px solid var(--leaf);outline-offset:3px}
.ch.no{animation:shake .4s}
.ch.hint{animation:pulse 1s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes pulse{0%,100%{outline:5px solid transparent}50%{outline:5px solid var(--gold);outline-offset:3px}}
.cheer{font-family:var(--display);font-weight:700;font-size:26px;min-height:34px;color:#1F8A3A;text-align:center}

/* Builder */
.world{
  display:grid;grid-template-columns:repeat(12,minmax(0,1fr));width:100%;max-width:600px;
  background:linear-gradient(#8FD2FF,#D6F0FF);touch-action:none;border-radius:18px;overflow:hidden;
  box-shadow:inset 0 0 0 3px rgba(30,42,74,.15);
}
.world div{aspect-ratio:1;background-size:100% 100%}
.palette{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:600px}
.pb{width:58px;height:58px;padding:0;border-radius:14px;display:grid;place-items:center;transition:transform .1s}
.pb img{width:100%;height:100%}
.pb.on{outline:5px solid var(--berry);outline-offset:2px;transform:translateY(-3px)}
.pb.erase{background:var(--panel-hi);font-size:28px;box-shadow:0 3px 0 rgba(30,42,74,.12)}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.small{color:var(--soft);font-size:15px;text-align:center;margin:0}

/* Planets */
.viewer{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:480px;width:100%}
.viewer .sky{background:radial-gradient(circle at 30% 30%,#2C3A7A,var(--space));border-radius:24px;width:100%;display:grid;place-items:center;padding:12px}
.viewer img{width:clamp(170px,48vw,240px);height:clamp(170px,48vw,240px)}
.viewer h3{font-family:var(--display);font-weight:700;font-size:34px;margin:0;color:#C2470F}
.viewer p{margin:0;font-size:20px;line-height:1.45;max-width:36ch;text-wrap:pretty}
.strip{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:620px}
.pl{background:var(--space);color:#fff;border-radius:16px;padding:6px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;min-width:70px}
.pl img{width:54px;height:54px}
.pl.on{outline:4px solid var(--gold);outline-offset:2px}
.orbit{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;max-width:640px;background:radial-gradient(circle at 20% 40%,#2C3A7A,var(--space));padding:14px;border-radius:22px}
.orbit .slot{width:60px;height:60px;border:3px dashed rgba(255,255,255,.35);border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#B9C0E6}
.orbit .slot img{width:58px;height:58px}
.orbit .sun img{width:84px;height:84px}
.pool{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.pool .ch{min-width:86px;min-height:86px;background:var(--space)}
.pool .ch img{width:70px;height:70px}
.pool .ch.used{visibility:hidden}

/* Memory */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:520px}
@media (max-width:460px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mc{aspect-ratio:1;max-width:100%;position:relative;perspective:600px}
.mc .in{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.mc.open .in,.mc.done .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;box-shadow:0 4px 0 rgba(30,42,74,.14)}
.mc .f{background:#7C5CE0;background-image:radial-gradient(circle,rgba(255,255,255,.3) 4px,transparent 5px);background-size:22px 22px}
.mc .b{background:#EAF4FF;transform:rotateY(180deg)}
.mc .b img{width:80%;height:80%}
.mc.done .b{background:#CDF3DA}

/* Friend chooser */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(30,42,74,.5);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.overlay[hidden]{display:none}
.pickbox{background:var(--panel);border-radius:28px;box-shadow:var(--lift);padding:22px 16px 24px;max-width:660px;width:100%;display:flex;flex-direction:column;gap:16px}
.friends{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:12px}
.friend{background:var(--panel-hi);border-radius:22px;padding:12px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--display);font-weight:700;font-size:16px;box-shadow:0 4px 0 rgba(30,42,74,.12);transition:transform .1s}
.friend img{width:96px;height:96px}
.friend:hover img{animation:bob 1s ease-in-out infinite}
.friend:active{transform:translateY(4px)}
.friend.on{outline:5px solid var(--gold);outline-offset:2px}

/* Obstacle run */
.run{position:relative;width:100%;height:min(62vh,520px);min-height:320px;border-radius:22px;overflow:hidden;background:#9ED8FF;touch-action:none}
.run canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:center;gap:10px;pointer-events:none}
.hud .pill{background:rgba(255,255,255,.92);border-radius:999px;padding:4px 12px;font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.prog{flex:1;height:14px;background:rgba(255,255,255,.7);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--gold));border-radius:999px}
.startov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(30,42,74,.25);text-align:center}
.startov[hidden]{display:none}
.startov .box{display:flex;flex-direction:column;align-items:center;gap:12px;background:rgba(255,255,255,.95);border-radius:24px;padding:18px 20px;max-width:90%}
.startov .box p{margin:0;font-family:var(--display);font-weight:700;font-size:22px;text-wrap:balance}
.pad{display:flex;gap:12px;justify-content:center;width:100%}
.pbtn{flex:1;max-width:140px;min-height:78px;border-radius:24px;background:var(--panel-hi);font-size:36px;font-weight:800;box-shadow:0 6px 0 rgba(30,42,74,.14);touch-action:manipulation}
.pbtn.jump{background:var(--gold);color:#3A2A00;font-size:24px;max-width:190px}
.pbtn:active{transform:translateY(4px)}
.pbtn.jump.now{animation:jumpnow .5s ease-in-out infinite}
@keyframes jumpnow{0%,100%{transform:scale(1);box-shadow:0 6px 0 rgba(30,42,74,.14),0 0 0 0 rgba(255,200,61,.8)}50%{transform:scale(1.08);box-shadow:0 6px 0 rgba(30,42,74,.14),0 0 0 10px rgba(255,200,61,0)}}
.speedrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;font-weight:800}
.spd{background:var(--panel-hi);border-radius:999px;padding:10px 18px;font-weight:800;font-size:19px;box-shadow:0 3px 0 rgba(30,42,74,.12)}
.spd.on{background:var(--leaf);color:#fff}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;width:100%}
.theme{border-radius:24px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 6px 0 rgba(30,42,74,.16);transition:transform .1s;text-align:center}
.theme:active{transform:translateY(4px)}
.theme.sky{background:linear-gradient(#8FD2FF,#E3F5FF)}
.theme.space{background:radial-gradient(circle at 30% 30%,#3A4A9A,#141B3D);color:#fff}
.theme.space .small{color:#C9D0F5}
.theme .ti{font-size:64px;line-height:1}
.theme .tn{font-family:var(--display);font-weight:700;font-size:22px}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.foot{color:var(--soft);font-size:14px;text-align:center;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<canvas id="fx"></canvas>
<div class="overlay" id="chooser" hidden>
  <div class="pickbox">
    <p class="q pickq">Ποιος φίλος θα παίξει μαζί σου σήμερα;</p>
    <div class="friends" id="friends"></div>
  </div>
</div>
<div class="wrap">
  <header>
    <div class="hello">
      <button id="mascotBtn" aria-label="Μασκότ"><img class="px mascot" id="mascot" alt=""></button>
      <div class="hi"><h1>Γεια σου, Άγγελε!</h1><div class="row"><span class="bubble" id="bubble"></span><button class="btn mini" id="swap">🔄 Άλλαξε φίλο</button></div></div>
    </div>
    <div class="gems" aria-label="Κρύσταλλοι"><img class="px" id="gemImg" alt=""><span id="gemN">0</span></div>
  </header>
  <main id="app"></main>
  <p class="foot">Πάτα το 🔊 για να ακούσεις την ερώτηση. Κάθε σωστή απάντηση σου δίνει έναν κρύσταλλο.</p>
</div>

<script>
const $ = s => document.querySelector(s);
const app = $('#app');
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]} return a; };
const pick = a => a[rnd(a.length)];
const NAME = 'Άγγελε';
const TAU = Math.PI*2, O = '#2A2F45';

/* ===== Drawing helpers (smooth canvas illustrations) ===== */
function toURL(w,h,fn){ const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); fn(x); return c.toDataURL(); }
function rrPath(c,x,y,w,h,r){ c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
const IMG = {};

/* Blocks: glossy rounded cubes */
const BLOCKS = {
  stone:{nm:'πέτρα', l:'#B3B8C2', d:'#7B808A', deco:c=>{ c.fillStyle='rgba(60,65,75,.22)'; [[18,22,8],[44,18,6],[30,42,9],[50,48,6],[14,50,5]].forEach(([x,y,r])=>{c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}); }},
  wood:{nm:'ξύλο', l:'#D29A5E', d:'#9A6334', deco:c=>{ c.strokeStyle='#6B4524'; c.lineWidth=3; [22,43].forEach(y=>{c.beginPath();c.moveTo(0,y);c.lineTo(64,y);c.stroke();}); c.strokeStyle='rgba(90,55,25,.35)'; c.lineWidth=1.5; [12,32,54].forEach(y=>{c.beginPath();c.moveTo(4,y);c.bezierCurveTo(20,y-3,40,y+3,60,y);c.stroke();}); c.fillStyle='rgba(90,55,25,.45)'; c.beginPath(); c.ellipse(44,32,4,2.5,0,0,TAU); c.fill(); }},
  leaves:{nm:'φύλλα', l:'#5CC456', d:'#2E7D30', deco:c=>{ c.fillStyle='#86DA77'; [[16,18,.6],[40,14,-.5],[28,34,.3],[50,40,.8],[14,46,-.4],[38,52,.2]].forEach(([x,y,r])=>{c.beginPath();c.ellipse(x,y,7,3.5,r,0,TAU);c.fill();}); }},
  sand:{nm:'άμμος', l:'#F5E3A3', d:'#D4BA6E', deco:c=>{ c.fillStyle='rgba(150,120,50,.35)'; for(let i=0;i<26;i++){ c.beginPath(); c.arc((i*23)%58+4,(i*37)%58+4,1.6,0,TAU); c.fill(); } }},
  water:{nm:'νερό', l:'#5FAEFF', d:'#2560C9', deco:c=>{ c.strokeStyle='rgba(255,255,255,.6)'; c.lineWidth=3; c.lineCap='round'; [20,36,52].forEach((y,i)=>{c.beginPath();c.moveTo(8+i*4,y);c.quadraticCurveTo(18+i*4,y-6,28+i*4,y);c.quadraticCurveTo(38+i*4,y+6,48+i*4,y);c.stroke();}); }},
  brick:{nm:'τούβλο', l:'#D9604A', d:'#A33A28', deco:c=>{ c.strokeStyle='rgba(255,240,230,.85)'; c.lineWidth=3; c.beginPath(); [21,42].forEach(y=>{c.moveTo(0,y);c.lineTo(64,y);}); c.moveTo(32,0);c.lineTo(32,21); c.moveTo(16,21);c.lineTo(16,42); c.moveTo(48,21);c.lineTo(48,42); c.moveTo(32,42);c.lineTo(32,64); c.stroke(); }},
  glass:{nm:'γυαλί', l:'rgba(225,246,255,.85)', d:'rgba(150,205,240,.75)', deco:c=>{ c.strokeStyle='rgba(255,255,255,.95)'; c.lineWidth=4; c.lineCap='round'; c.beginPath(); c.moveTo(14,36); c.lineTo(32,14); c.moveTo(24,44); c.lineTo(40,24); c.stroke(); }},
  gold:{nm:'χρυσός', l:'#FFE27A', d:'#E0A51A', deco:c=>{ c.fillStyle='#fff'; c.beginPath(); const x=44,y=22; c.moveTo(x,y-9); c.quadraticCurveTo(x,y,x+9,y); c.quadraticCurveTo(x,y,x,y+9); c.quadraticCurveTo(x,y,x-9,y); c.quadraticCurveTo(x,y,x,y-9); c.fill(); }},

function ring(c,cx,cy,R,front){
  c.save(); c.beginPath(); front?c.rect(0,cy,128,64):c.rect(0,0,128,cy); c.clip();
  c.lineWidth=8; c.strokeStyle='#D9C48F'; c.beginPath(); c.ellipse(cx,cy,R*1.8,R*.5,0,0,TAU); c.stroke();
  c.lineWidth=3; c.strokeStyle='#B89E66'; c.beginPath(); c.ellipse(cx,cy,R*1.45,R*.38,0,0,TAU); c.stroke();
  c.restore();
}

    if(p.ring) ring(c,cx,cy,R,false);
    c.save(); c.beginPath(); c.arc(cx,cy,R,0,TAU); c.clip();

    c.restore();
    if(p.ring) ring(c,cx,cy,R,true);
  });
});

/* Mascots: cartoon friends drawn on a 160×160 canvas */
function art(fn){ return toURL(160,160,c=>{
  c.lineJoin='round'; c.lineCap='round';
  const S=(fill,path,lw=4)=>{ c.beginPath(); path(); c.fillStyle=fill; c.fill(); if(lw){ c.lineWidth=lw; c.strokeStyle=O; c.stroke(); } };
  const F=(fill,path)=>S(fill,path,0);
  const L=(x1,y1,x2,y2,col=O,w=4)=>{ c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.strokeStyle=col; c.lineWidth=w; c.stroke(); };
  const C=(x,y,r)=>()=>c.arc(x,y,r,0,TAU);
  const E=(x,y,rx,ry,rot=0)=>()=>c.ellipse(x,y,rx,ry,rot,0,TAU);
  const R=(x,y,w,h,r)=>()=>rrPath(c,x,y,w,h,r);
  const P=(...pts)=>()=>{ c.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) c.lineTo(pts[i],pts[i+1]); c.closePath(); };
  const eye=(x,y,r=6)=>{ F(O,C(x,y,r)); F('#fff',C(x-r*.35,y-r*.35,r*.38)); };
  const smile=(x,y,w)=>{ c.beginPath(); c.arc(x,y,w,.18*Math.PI,.82*Math.PI); c.strokeStyle=O; c.lineWidth=3.5; c.stroke(); };
  const cheeks=(x1,x2,y)=>{ F('rgba(255,120,140,.45)',E(x1,y,7,4.5)); F('rgba(255,120,140,.45)',E(x2,y,7,4.5)); };
  fn({c,S,F,L,C,E,R,P,eye,smile,cheeks});
}); }

/* ===== Sound & speech ===== */
let ac;
function tone(freqs,dur=.12,type='triangle'){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.value=f;
      const t=ac.currentTime+i*dur;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.2,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur*1.6);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur*1.8);
    });
  }catch(e){}
}
const yay=()=>tone([523,659,784,1047]); const oops=()=>tone([260,200],.15); const blip=()=>tone([660],.06);
function speak(txt){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt); u.lang='el-GR'; u.rate=.9; u.pitch=1.1;
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('el')); if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ===== Confetti ===== */
const cv=$('#fx'), cx=cv.getContext('2d'); let bits=[];
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#FFC83D','#E8476B','#3DB867','#59B8FF','#9B6BF2'];
  const start=!bits.length;
  for(let i=0;i<70;i++) bits.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*15,vy:Math.random()*-14-4,r:Math.random()*5+4,c:pick(cols),life:80});
  if(start) requestAnimationFrame(loop);
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.45;b.life--;cx.fillStyle=b.c;cx.beginPath();cx.arc(b.x,b.y,b.r,0,TAU);cx.fill()});
  bits=bits.filter(b=>b.life>0);
  if(bits.length) requestAnimationFrame(loop); else cx.clearRect(0,0,cv.width,cv.height);
}

/* ===== Space: find the planet ===== */
const planetQs=[
  ['mars','Βρες τον κόκκινο πλανήτη!'],['saturn','Βρες τον πλανήτη με τα δαχτυλίδια!'],
  ['earth','Βρες τη Γη, το σπίτι μας!'],['jupiter','Βρες τον πιο μεγάλο πλανήτη!'],
  ['sun','Βρες τον Ήλιο!'],['moon','Βρες τη Σελήνη!'],['mercury','Βρες τον πιο μικρό πλανήτη!'],
  ['neptune','Βρες τον Ποσειδώνα, τον πιο μακρινό πλανήτη!'],['venus','Βρες την Αφροδίτη, τον πιο ζεστό πλανήτη!'],
  ['uranus','Βρες τον Ουρανό, τον γαλάζιο πλανήτη!'],
];
let lastQ;
function findPlanet(){
  let q; do{ q=pick(planetQs) }while(q===lastQ); lastQ=q;
  const [goal,text]=q;
  shell(text,text);
  $('#stage').remove();
  const others=shuffle(Object.keys(BODIES).filter(k=>k!==goal)).slice(0,2);
  shuffle([goal,...others]).forEach(k=>choiceBtn(img(k),b=>{
    if(k===goal){ b.classList.add('ok'); win(BODIES[k].nm+'!'); next(findPlanet); }
    else miss(b,'Αυτός είναι '+(['venus','earth','moon'].includes(k)?'η ':'ο ')+BODIES[k].nm+'.');
  },'planet'));
}

const COLS=12, ROWS=9;
function build(){
  shell(`Χτίσε τον δικό σου κόσμο, ${NAME}!`,'');
  $('#stage').remove(); $('#choices').remove(); $('.cheer').remove();
  let cells=null; try{ cells=JSON.parse(localStorage.getItem('world')||'null') }catch(e){}
  if(!Array.isArray(cells)||cells.length!==COLS*ROWS){
    cells=Array(COLS*ROWS).fill('');
    for(let x=0;x<COLS;x++){ cells[(ROWS-1)*COLS+x]='stone'; cells[(ROWS-2)*COLS+x]=(x>7?'water':'sand'); }
    [[2,6],[2,5],[2,4]].forEach(([x,y])=>cells[y*COLS+x]='wood');
    [[1,3],[2,3],[3,3],[2,2],[1,2],[3,2]].forEach(([x,y])=>cells[y*COLS+x]='leaves');
  }
  $('.card').insertAdjacentHTML('beforeend',`<div class="world" id="world"></div><div class="palette" id="pal"></div>
    <div class="tools"><button class="btn" id="clear">🧹 Καθάρισμα</button></div>
    <p class="small">Διάλεξε κύβο και πάτα ή σύρε το δάχτυλο πάνω στον κόσμο. Ο κόσμος σου μένει αποθηκευμένος.</p>`);
  const world=$('#world');
  const save=()=>{ try{localStorage.setItem('world',JSON.stringify(cells))}catch(e){} };
  const paint=i=>{ world.children[i].style.backgroundImage=cells[i]?`url(${IMG[cells[i]]})`:'none'; };
  cells.forEach((c,i)=>{ const d=document.createElement('div'); d.dataset.i=i; world.append(d); paint(i); });
  let tool='brick';
  [...Object.keys(BLOCKS),'erase'].forEach(k=>{
    const b=document.createElement('button'); b.className='pb'+(k==='erase'?' erase':''); b.dataset.k=k;
    b.innerHTML=k==='erase'?'🧽':img(k);
    b.setAttribute('aria-label',k==='erase'?'σβήσιμο':BLOCKS[k].nm);
    b.onclick=()=>{ tool=k; blip(); document.querySelectorAll('.pb').forEach(x=>x.classList.toggle('on',x===b)); speak(k==='erase'?'σβήσιμο':BLOCKS[k].nm); };
    $('#pal').append(b);
  });
  document.querySelector('.pb[data-k="brick"]').classList.add('on');
  let down=false, lastI=-1;
  const at=e=>{ const el=document.elementFromPoint(e.clientX,e.clientY); if(!el||el.parentNode!==world) return;
    const i=+el.dataset.i; if(i===lastI) return; lastI=i;
    const v=tool==='erase'?'':tool; if(cells[i]!==v){ cells[i]=v; paint(i); tone([tool==='erase'?300:440+rnd(200)],.04); } };
  world.addEventListener('pointerdown',e=>{ down=true; lastI=-1; try{world.setPointerCapture(e.pointerId)}catch(_){} at(e); });
  world.addEventListener('pointermove',e=>{ if(down) at(e); });
  const up=()=>{ if(down){ down=false; save(); } };
  world.addEventListener('pointerup',up); world.addEventListener('pointercancel',up);
  let armed=false, armT;
  $('#clear').onclick=()=>{
    if(!armed){ armed=true; $('#clear').textContent='Σίγουρα; Πάτα ξανά'; armT=setTimeout(()=>{armed=false;$('#clear').textContent='🧹 Καθάρισμα'},3000); return; }
    clearTimeout(armT); armed=false; $('#clear').textContent='🧹 Καθάρισμα';
    cells=cells.map(()=>''); cells.forEach((c,i)=>paint(i)); save(); tone([400,300,200],.08);
  };
}

/* ===== Blocks: count ===== */
const numWords=['μηδέν','ένα','δύο','τρία','τέσσερα','πέντε','έξι','επτά','οκτώ','εννιά','δέκα'];
const countable=['gold','gem','brick','wood','leaves','lava','pink','snow','stone','water'];
function numChoices(n,max){ const s=new Set([n]); while(s.size<3){ s.add(Math.max(1,Math.min(max,n+rnd(5)-2))) } return shuffle([...s]); }
function count(){
  const n=rnd(10)+1, t=pick(countable);
  shell('Πόσοι κύβοι είναι;','Μέτρα τους κύβους! Πόσοι είναι;');
  $('#stage').innerHTML=Array(n).fill(img(t)).join('');
  numChoices(n,10).forEach(k=>choiceBtn(k,b=>{ if(k===n){ b.classList.add('ok'); win(numWords[n]+'!'); next(count);} else miss(b) }));
}

/* ===== Blocks: addition ===== */
function add(){
  const a=rnd(5)+1, b=rnd(Math.min(5,10-a))+1, [t1,t2]=shuffle(countable).slice(0,2), sum=a+b;
  shell(`${a} + ${b} = ;`,`${numWords[a]} και ${numWords[b]}, πόσο κάνουν;`);
  $('#stage').innerHTML=`<div class="group">${Array(a).fill(img(t1)).join('')}</div><span class="plus">+</span><div class="group">${Array(b).fill(img(t2)).join('')}</div>`;
  numChoices(sum,10).forEach(k=>choiceBtn(k,btn=>{ if(k===sum){ btn.classList.add('ok'); $('.card .q').textContent=`${a} + ${b} = ${sum}`; win(`${numWords[a]} και ${numWords[b]} κάνουν ${numWords[sum]}!`); next(add);} else miss(btn) }));
}

/* ===== Blocks: pattern ===== */
const forms=[[0,1],[0,1,2],[0,0,1],[0,1,1]];
function pattern(){
  const f=pick(forms), kinds=shuffle(countable).slice(0,3);
  const seq=Array.from({length:6},(_,i)=>kinds[f[i%f.length]]);
  const ans=kinds[f[6%f.length]];
  shell('Ποιος κύβος έρχεται μετά;','Κοίτα το μοτίβο. Ποιος κύβος έρχεται μετά;');
  $('#stage').innerHTML=seq.map(k=>img(k)).join('')+'<div class="qbox">?</div>';
  const opts=new Set([ans]); shuffle([...kinds,...countable]).forEach(k=>{ if(opts.size<3) opts.add(k) });
  shuffle([...opts]).forEach(k=>choiceBtn(img(k),b=>{
    if(k===ans){ b.classList.add('ok'); $('.qbox').outerHTML=img(k); win(); next(pattern); } else miss(b);
  }));
}

function memory(){
  shell('Βρες τα ίδια ζευγάρια!','Βρες τα ίδια ζευγάρια!');
  $('#stage').remove(); $('#choices').remove();
  const pool=['sun','earth','mars','saturn','jupiter','moon','m_astro','m_santa','m_dog','m_cat','m_dino','m_robot','m_alien','m_snow'];
  const set=shuffle(pool).slice(0,6), deck=shuffle([...set,...set]);
  const g=document.createElement('div'); g.className='grid';
  let open=[], found=0, lock=false;
  deck.forEach(f=>{
    const c=document.createElement('button'); c.className='mc'; c.dataset.f=f; c.setAttribute('aria-label','κάρτα');
    c.innerHTML=`<div class="in"><div class="f"></div><div class="b">${img(f)}</div></div>`;
    c.onclick=()=>{
      if(lock||c.classList.contains('open')||c.classList.contains('done')) return;
      c.classList.add('open'); blip(); open.push(c);
      if(open.length===2){
        lock=true; const [a,b]=open;
        if(a.dataset.f===b.dataset.f){
          setTimeout(()=>{ a.classList.add('done'); b.classList.add('done'); open=[]; lock=false; found++;
            if(found===6){ win('Τα βρήκες όλα!'); const r=document.createElement('button'); r.className='btn go'; r.textContent='Ξανά 🔄'; r.onclick=memory; $('.card').append(r); }
            else tone([784,1047],.1);
          },350);
        } else setTimeout(()=>{ a.classList.remove('open'); b.classList.remove('open'); open=[]; lock=false; },900);
      }
    };
    g.append(c);
  });
  $('.card .q').after(g);
}

  $('#stage').insertAdjacentHTML('afterend',`<div class="word"><span class="gap">&nbsp;</span>${W.slice(1)}</div>`);
  const others=shuffle([...new Set(words.map(w=>w[0]).filter(x=>x!==L))]).slice(0,2);
  shuffle([L,...others]).forEach(k=>choiceBtn(k,b=>{ if(k===L){ b.classList.add('ok'); $('.word .gap').textContent=L; win(S+'!'); next(letter);} else miss(b) }));
}

/* ===== Colors ===== */
const colors=[
  {n:'κόκκινο',c:'#E5383B'},{n:'μπλε',c:'#2F6FE4'},{n:'κίτρινο',c:'#FFD23F'},{n:'πράσινο',c:'#2BA84A'},
  {n:'πορτοκαλί',c:'#FF8C1A'},{n:'μωβ',c:'#8E44D6'},{n:'ροζ',c:'#FF7EB6'},{n:'μαύρο',c:'#111111'},
  {n:'άσπρο',c:'#FFFFFF'},{n:'καφέ',c:'#8B5A2B'}
];
function color(){
  const opts=shuffle(colors).slice(0,4), goal=pick(opts);
  shell(`Βρες το ${goal.n}`,`Βρες το ${goal.n}!`);
  $('#stage').remove();
  opts.forEach(o=>{ const b=choiceBtn('',btn=>{ if(o===goal){ btn.classList.add('ok'); win(); next(color);} else miss(btn,'Αυτό είναι '+o.n+'.') },'sw'); b.style.setProperty('--c',o.c); b.setAttribute('aria-label',o.n); });
}


/* ===== Adventure: 3D obstacle run ===== */
let obbyLvl=1, obbyTheme='sky', obbySpeed='slow';
try{ obbyLvl=parseInt(localStorage.getItem('obbyLvl')||'1',10)||1; obbyTheme=localStorage.getItem('obbyTheme')||'sky'; obbySpeed=localStorage.getItem('obbySpeed')||'slow'; }catch(e){}
const THEMES={
  sky:{nm:'Πίστα στα σύννεφα', icon:'☁️', bg:'#9ED8FF', g:14, jv:7.7, sv:10.5, tiles:['#FF6B8B','#FFC83D','#4CC35A','#59B8FF','#9B6BF2','#FF8A3D']},
  space:{nm:'Πίστα στο διάστημα', icon:'🚀', bg:'#141B3D', g:9.5, jv:6.3, sv:8.6, tiles:['#7C5CE0','#3D8BFD','#3FE0E8','#FF6BCB','#FFC83D','#4CC35A']},
};
function obby(){
  shell('Πίστα με εμπόδια','Πού θέλεις να τρέξεις σήμερα;',{quiet:true});
  $('#stage').remove(); $('#choices').remove();
  $('.card .q').insertAdjacentHTML('afterend',`<div class="themes">${Object.entries(THEMES).map(([k,t])=>`
    <button class="theme ${k}" data-t="${k}"><span class="ti">${t.icon}</span><span class="tn">${t.nm}</span><span class="small">${k==='space'?'Πλανήτες, αστέρια και πήδημα σαν αστροναύτης!':'Ελατήρια, σύννεφα και κινούμενες πλατφόρμες!'}</span></button>`).join('')}</div>
    <div class="speedrow"><span>Ταχύτητα:</span>
      <button class="spd" data-s="slow">🐢 Αργά</button><button class="spd" data-s="fast">🐇 Γρήγορα</button></div>
    <p class="small">Είσαι στην πίστα ${obbyLvl}.</p>`);
  const markSpd=()=>document.querySelectorAll('.spd').forEach(b=>b.classList.toggle('on',b.dataset.s===obbySpeed));
  document.querySelectorAll('.spd').forEach(b=>b.onclick=()=>{ obbySpeed=b.dataset.s; try{localStorage.setItem('obbySpeed',obbySpeed)}catch(e){} blip(); markSpd(); speak(obbySpeed==='slow'?'Αργά, σαν χελωνίτσα':'Γρήγορα, σαν λαγουδάκι'); });
  markSpd();
  document.querySelectorAll('.theme').forEach(b=>b.onclick=()=>{ blip(); obbyTheme=b.dataset.t; try{localStorage.setItem('obbyTheme',obbyTheme)}catch(e){} runLevel(); });
}
function runLevel(){
  const TH=THEMES[obbyTheme];
  shell(`${TH.icon} Πίστα ${obbyLvl}`,'Τρέξε! Πήδα πάνω από τα κενά και τα εμπόδια, πάτα τα ελατήρια και μάζεψε κρυστάλλους!',{quiet:true});
  $('#stage').remove(); $('#choices').remove();
  $('#back').onclick=obby;
  if(!window.THREE){ $('.cheer').textContent='Το παιχνίδι δεν φόρτωσε. Δοκίμασε να ανοίξεις ξανά τη σελίδα.'; return; }
  $('.card .q').insertAdjacentHTML('afterend',`<div class="run" id="run">
      <div class="hud"><span class="pill" id="rg">💎 0</span><div class="prog"><i id="pf"></i></div><span class="pill">🏁</span></div>
      <div class="startov" id="startov"><div class="box"><img class="px" src="${IMG['m_'+buddy.id]}" alt="" style="width:90px;height:90px"><p>Βοήθησε ${buddy.acc} να φτάσει στη σημαία!</p><button class="btn go" id="go">Πάμε! ▶</button></div></div>
    </div>
    <div class="pad"><button class="pbtn" id="kL" aria-label="Αριστερά">◀</button><button class="pbtn jump" id="kJ">⬆ Πήδα</button><button class="pbtn" id="kR" aria-label="Δεξιά">▶</button></div>
    <p class="small">🟡 Τα κίτρινα ελατήρια σε πετάνε ψηλά. Στις πλατφόρμες που κουνιούνται, η μεσαία λωρίδα είναι πάντα ασφαλής.</p>`);
  const T=THREE, box=$('#run');
  const lvl=obbyLvl, SEG=4, N=Math.min(90,34+lvl*8), GRAV=TH.g, JV=TH.jv, SV=TH.sv;
  const speed=obbySpeed==='slow' ? Math.min(4.2,3.4+(lvl-1)*.1) : Math.min(6.5,4.8+(lvl-1)*.2);
  const pGap=Math.min(.2,.08+lvl*.02), pBar=Math.min(.24,.12+lvl*.02), pSpring=.1, pMover=lvl>1?Math.min(.14,.06+lvl*.02):.06;
  const LANES=[-2,0,2], END=-N*SEG;

  const renderer=new T.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  box.prepend(renderer.domElement);
  const scene=new T.Scene(); const skyCol=new T.Color(TH.bg); scene.background=skyCol; scene.fog=new T.Fog(skyCol,30,85);
  const cam=new T.PerspectiveCamera(60,1,.1,250);
  scene.add(new T.HemisphereLight(0xffffff,obbyTheme==='space'?0x5566aa:0x88aacc,.95));
  const sunL=new T.DirectionalLight(0xffffff,.65); sunL.position.set(5,10,6); scene.add(sunL);

  const mats={}; const mat=c=>mats[c]||(mats[c]=new T.MeshLambertMaterial({color:c}));
  const gaps=[], bars=[], gemsArr=[], springs=[], movers=[], spinners=[];
  const addTile=(x,z0,z1,col)=>{ const m=new T.Mesh(new T.BoxGeometry(1.9,.5,z0-z1-.08),mat(col)); m.position.set(x,-.25,(z0+z1)/2); scene.add(m); };
  const gemGeo=new T.OctahedronGeometry(.32), gemMat=new T.MeshLambertMaterial({color:'#3FE0E8',emissive:'#1199aa',emissiveIntensity:.4});
  const addGemAt=(x,y,z)=>{ const m=new T.Mesh(gemGeo,gemMat); m.position.set(x,y,z); scene.add(m); gemsArr.push(m); };
  const tc=(i,l)=>TH.tiles[(i+l)%TH.tiles.length];
  let prevObstacle=true;
  for(let i=0;i<N;i++){
    const z0=-i*SEG, z1=-(i+1)*SEG, mid=(z0+z1)/2;
    const safe=i<4||i>N-4||prevObstacle;
    const r=Math.random();
    prevObstacle=!safe;
    if(!safe && r<pGap){
      LANES.forEach((x,l)=>{ addTile(x,z0,z0-1.2,tc(i,l)); addTile(x,z1+1.2,z1,tc(i,l)); });
      gaps.push([z0-1.2,z1+1.2]); addGemAt(LANES[rnd(3)],2,mid);
    } else if(!safe && r<pGap+pMover){
      // moving platform over a gap: it slides left-right, the middle lane is always covered
      LANES.forEach((x,l)=>{ addTile(x,z0,z0-.6,tc(i,l)); addTile(x,z1+.6,z1,tc(i,l)); });
      const m=new T.Mesh(new T.BoxGeometry(3.8,.5,SEG-1.3),mat('#FFFFFF'));
      const stripe=new T.Mesh(new T.BoxGeometry(3.82,.12,SEG-1.25),mat(TH.tiles[i%TH.tiles.length])); stripe.position.y=.2; m.add(stripe);
      m.position.set(0,-.25,mid); scene.add(m);
      movers.push({a:z0-.6,b:z1+.6,mesh:m,ph:Math.random()*6}); addGemAt(0,.8,mid);
    } else if(!safe && r<pGap+pMover+pBar){
      LANES.forEach((x,l)=>addTile(x,z0,z1,tc(i,l)));
      const blocked=shuffle([0,1,2]).slice(0,1+(lvl>2&&Math.random()<.4?1:0));
      blocked.forEach(l=>{ const m=new T.Mesh(new T.BoxGeometry(1.5,.7,.7),mat(obbyTheme==='space'?'#8A8F9C':'#8B5A2B')); m.position.set(LANES[l],.35,mid); scene.add(m);
        const top=new T.Mesh(new T.BoxGeometry(1.6,.12,.8),mat('#FFFFFF')); top.position.set(LANES[l],.76,mid); scene.add(top);
        bars.push({z:mid,x:LANES[l]}); });
    } else if(!safe && r<pGap+pMover+pBar+pSpring){
      LANES.forEach((x,l)=>addTile(x,z0,z1,tc(i,l)));
      const l=rnd(3), x=LANES[l];
      const base=new T.Mesh(new T.CylinderGeometry(.55,.65,.25,20),mat('#FFC83D')); base.position.set(x,.12,mid); scene.add(base);
      const top=new T.Mesh(new T.CylinderGeometry(.6,.6,.12,20),mat('#E8476B')); top.position.set(x,.3,mid); scene.add(top);
      springs.push({z:mid,x,top});
      const air=2*SV/GRAV; for(let k=1;k<=5;k++){ const tk=air*k/6; addGemAt(x,.8+SV*tk-GRAV*tk*tk/2,mid-speed*tk); }
    } else {
      LANES.forEach((x,l)=>addTile(x,z0,z1,tc(i,l)));
      if(i>1 && Math.random()<.55){ const x=LANES[rnd(3)]; addGemAt(x,.8,mid-1); addGemAt(x,.8,mid+1); }
      prevObstacle=false;
    }
  }
  // finish arch
  const fz=END+2;
  [-3.3,3.3].forEach(x=>{ const m=new T.Mesh(new T.BoxGeometry(.6,4,.6),mat('#FFC83D')); m.position.set(x,2,fz); scene.add(m); });
  for(let k=0;k<8;k++){ const m=new T.Mesh(new T.BoxGeometry(.85,.7,.4),mat(k%2?'#FFFFFF':'#2A2F45')); m.position.set(-3+k*.86,4.1,fz); scene.add(m); }

  // scenery
  if(obbyTheme==='space'){
    const pts=[]; for(let k=0;k<900;k++){ pts.push((Math.random()-.5)*120,(Math.random()-.3)*60,-Math.random()*(N*SEG+60)+20); }
    const sg=new T.BufferGeometry(); sg.setAttribute('position',new T.Float32BufferAttribute(pts,3));
    scene.add(new T.Points(sg,new T.PointsMaterial({color:0xffffff,size:.35,fog:false})));
    const planets=['saturn','jupiter','earth','mars','moon','neptune','uranus','venus'];
    for(let k=0;k<Math.ceil(N/6);k++){
      const sp=new T.Sprite(new T.SpriteMaterial({map:new T.TextureLoader().load(IMG[planets[k%planets.length]]),fog:false}));
      const sc=8+Math.random()*8; sp.scale.set(sc,sc,1);
      sp.position.set((k%2?1:-1)*(16+Math.random()*10),4+Math.random()*10,-k*SEG*6-20); scene.add(sp);
    }
    const rockMat=new T.MeshLambertMaterial({color:'#8A8F9C'});
    for(let k=0;k<N/2;k++){ const m=new T.Mesh(new T.DodecahedronGeometry(.6+Math.random()*1.2),rockMat); m.position.set((k%2?1:-1)*(6+Math.random()*9),Math.random()*6-3,-k*SEG*2-Math.random()*6); spinners.push(m); scene.add(m); }
  } else {
    const cloudMat=new T.MeshLambertMaterial({color:'#FFFFFF'});
    for(let k=0;k<N/2;k++){
      const g=new T.Group(), side=k%2?1:-1;
      [[0,0,1.6],[1.4,.2,1.2],[-1.3,.1,1.1],[.4,.8,1]].forEach(([x,y,r])=>{ const s=new T.Mesh(new T.SphereGeometry(r,12,10),cloudMat); s.position.set(x,y,0); g.add(s); });
      g.position.set(side*(9+Math.random()*8),-3+Math.random()*7,-k*SEG*2-Math.random()*6); scene.add(g);
      if(k%2===0){ const c=new T.Mesh(new T.BoxGeometry(1.5,1.5,1.5),mat(pick(TH.tiles))); c.position.set(-side*(7+Math.random()*6),Math.random()*5-1,-k*SEG*2-3); c.rotation.set(Math.random(),Math.random(),0); spinners.push(c); scene.add(c); }
    }
  }
  // player
  const tex=new T.TextureLoader().load(IMG['m_'+buddy.id]);
  const player=new T.Sprite(new T.SpriteMaterial({map:tex,transparent:true})); player.scale.set(1.7,1.7,1); scene.add(player);
  const shadow=new T.Mesh(new T.CircleGeometry(.55,20),new T.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.22})); shadow.rotation.x=-Math.PI/2; scene.add(shadow);

  let jumpBuf=0, coyote=0, lane=1, px=0, py=0, vy=0, pz=0, running=false, done=false, freeze=0, got=0, raf=0, last=performance.now(), safeZ=0, t=0;
  const overGap=z=>gaps.some(([a,b])=>z<=a && z>=b);
  const moverAt=z=>movers.find(m=>z<=m.a && z>=m.b);
  const solid=(z,x)=>{ if(overGap(z)) return false; const m=moverAt(z); if(m) return Math.abs(x-m.mesh.position.x)<2.15; return true; };
  const doJump=()=>{ vy=JV; py=.01; coyote=0; jumpBuf=0; tone([520,700],.05); };
  const jump=()=>{ if(!running||done||freeze>0) return; if(py<=.001 && (solid(pz,px)||coyote>0)) doJump(); else jumpBuf=.35; };
  const move=d=>{ if(!running||done) return; const n=Math.max(0,Math.min(2,lane+d)); if(n!==lane){ lane=n; blip(); } };
  const respawn=()=>{ jumpBuf=0; coyote=0; $('#kJ').classList.remove('now'); pz=Math.min(0,safeZ+2.5); if(moverAt(pz)||overGap(pz)) pz=Math.min(0,pz+3); lane=1; px=0; py=0; vy=0; freeze=.9; oops(); speak(pick(['Ουπς! Ξανά!','Δεν πειράζει, πάμε πάλι!','Ωπ! Ξαναπροσπάθησε!'])); };
  function resize(){ const w=box.clientWidth, h=box.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); }
  const ro=new ResizeObserver(resize); ro.observe(box); resize();

  function frame(now){
    raf=requestAnimationFrame(frame);
    const dt=Math.min(.05,(now-last)/1000); last=now; t+=dt;
    movers.forEach(m=>{ m.mesh.position.x=Math.sin(t*1.4+m.ph); });
    if(running && !done){
      if(freeze>0){ freeze-=dt; }
      else {
        pz-=speed*dt;
        vy-=GRAV*dt; py+=vy*dt;
        const ground=solid(pz,px);
        if(py<=0 && ground && vy<=0 && py>-.4){ py=0; vy=0; coyote=.22; if(!moverAt(pz)) safeZ=pz; if(jumpBuf>0) doJump(); }
        else if(py<=0 && !ground && coyote>0 && jumpBuf>0){ py=0; doJump(); }
        jumpBuf=Math.max(0,jumpBuf-dt); if(!ground) coyote=Math.max(0,coyote-dt);
        const ahead=pz-speed*.9, near=gaps.some(([a,b])=>ahead<=a && pz>a) || bars.some(b=>b.x===LANES[lane] && b.z<pz && b.z>ahead-.5);
        $('#kJ').classList.toggle('now', near && py===0);
        if(py<-5) respawn();
        if(py===0) for(const sp of springs){ if(Math.abs(pz-sp.z)<.6 && Math.abs(px-sp.x)<.8){ vy=SV; py=.01; sp.boing=.3; tone([300,500,800,1200],.05); break; } }
        for(const b of bars){ if(Math.abs(pz-b.z)<.4 && Math.abs(px-b.x)<.9 && py<.6){ respawn(); break; } }
        for(const g of gemsArr){ if(g.visible && Math.abs(pz-g.position.z)<.8 && Math.abs(px-g.position.x)<.9 && Math.abs(py+.8-g.position.y)<1.2){ g.visible=false; got++; addGem(); $('#rg').textContent='💎 '+got; tone([880+got%5*60],.06); } }
        if(pz<=fz){ done=true; finish(); }
      }
    }
    springs.forEach(sp=>{ if(sp.boing>0){ sp.boing-=dt; sp.top.position.y=.3+Math.sin(sp.boing*20)*.25; } else sp.top.position.y=.3; });
    px+=(LANES[lane]-px)*Math.min(1,dt*12);
    const bob=(running&&!done&&py===0&&freeze<=0)?Math.abs(Math.sin(t*12))*.12:0;
    player.position.set(px,py+.85+bob,pz);
    player.material.opacity=freeze>0?(Math.sin(t*40)>0?.4:1):1;
    const gr=solid(pz,px); shadow.visible=gr && py>-.1; shadow.position.set(px,.01,pz); const sc=Math.max(.35,1-py*.12); shadow.scale.set(sc,sc,1);
    gemsArr.forEach(g=>{ g.rotation.y+=dt*2.5; });
    spinners.forEach(o=>{ o.rotation.y+=dt*.4; o.rotation.x+=dt*.15; });
    cam.position.set(px*.55,3.3+Math.max(0,py)*.35,pz+6.2); cam.lookAt(px*.55,1+Math.max(0,py)*.3,pz-5);
    $('#pf').style.width=Math.min(100,(pz/fz)*100)+'%';
    renderer.render(scene,cam);
  }
  raf=requestAnimationFrame(frame);

  function finish(){
    win(`Τερμάτισες την πίστα ${lvl}! Μάζεψες ${got} κρυστάλλους!`);
    obbyLvl++; try{localStorage.setItem('obbyLvl',obbyLvl)}catch(e){}
    const ov=$('#startov'); ov.hidden=false;
    ov.querySelector('.box').innerHTML=`<img class="px" src="${IMG['m_'+buddy.id]}" alt="" style="width:90px;height:90px"><p>Τερμάτισες! 🏁<br>Μάζεψες ${got} 💎</p><button class="btn go" id="nextLvl">Επόμενη πίστα ▶</button><button class="btn" id="sameLvl">Ξανά την ίδια</button><button class="btn" id="otherTh">${obbyTheme==='sky'?'🚀 Πάμε στο διάστημα':'☁️ Πάμε στα σύννεφα'}</button>`;
    $('#nextLvl').onclick=()=>runLevel();
    $('#sameLvl').onclick=()=>{ obbyLvl=lvl; try{localStorage.setItem('obbyLvl',lvl)}catch(e){} runLevel(); };
    $('#otherTh').onclick=()=>{ obbyTheme=obbyTheme==='sky'?'space':'sky'; try{localStorage.setItem('obbyTheme',obbyTheme)}catch(e){} runLevel(); };
  }
  $('#go').onclick=()=>{ $('#startov').hidden=true; running=true; last=performance.now(); speak('Πάμε!'); tone([523,659,784],.08); };
  const hold=(id,fn)=>$(id).addEventListener('pointerdown',e=>{ e.preventDefault(); fn(); });
  hold('#kL',()=>move(-1)); hold('#kR',()=>move(1)); hold('#kJ',jump);
  const key=e=>{ if(e.key==='ArrowLeft'){move(-1);e.preventDefault();} else if(e.key==='ArrowRight'){move(1);e.preventDefault();} else if(e.key==='ArrowUp'||e.key===' '){jump();e.preventDefault();} };
  window.addEventListener('keydown',key);
  let sx=0, sy=0; const cvs=renderer.domElement;
  cvs.addEventListener('pointerdown',e=>{ sx=e.clientX; sy=e.clientY; });
  cvs.addEventListener('pointerup',e=>{ const dx=e.clientX-sx, dy=e.clientY-sy; if(Math.abs(dx)>30 && Math.abs(dx)>Math.abs(dy)) move(dx>0?1:-1); else jump(); });
  cleanup=()=>{ cancelAnimationFrame(raf); window.removeEventListener('keydown',key); ro.disconnect(); renderer.dispose(); };
}
const GAMES={obby,explore,findPlanet,orderPlanets,build,count,add,pattern,memory,letter,color};
home();
chooser();
